name: Home Assistant companion

on:
  push:
    branches: [main]
    paths:
      - custom_components/mfi/**
      - home-assistant/**
      - tests/home_assistant/**
      - pyproject.toml
      - requirements-ha.lock
      - LICENSE
      - .github/workflows/home-assistant.yml
  pull_request:
    paths:
      - custom_components/mfi/**
      - home-assistant/**
      - tests/home_assistant/**
      - pyproject.toml
      - requirements-ha.lock
      - LICENSE
      - .github/workflows/home-assistant.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Check supported Python baseline
        run: python -c "import sys; assert (3, 14, 2) <= sys.version_info < (3, 15)"
      - name: Install test dependencies
        run: python -m pip install --group test -c requirements-ha.lock
      - name: Test companion and isolated distribution builder
        run: python -m pytest tests/home_assistant
      - name: Lint Python companion
        run: ruff check custom_components/mfi tests/home_assistant home-assistant/build_distribution.py
      - name: Type-check runtime
        run: mypy custom_components/mfi
      - name: Prepare committed integration-only distribution
        run: >-
          python home-assistant/build_distribution.py
          --source-commit "$GITHUB_SHA"
          --version 0.1.0
      - name: Verify prepared file checksums
        shell: bash
        run: |
          output="build/home-assistant/0.1.0-${GITHUB_SHA:0:12}"
          (cd "$output" && sha256sum --check SHA256SUMS)
      - name: Retain local preparation artifact, not a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mfi-home-assistant-0.1.0-${{ github.sha }}
          path: build/home-assistant/0.1.0-*/
          if-no-files-found: error
          retention-days: 7
